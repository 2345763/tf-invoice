<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Leadbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F4F7">
<meta name="description" content="Personal lead tracker. Your leads stay on your own device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, ruled lead register, bottom tab bar with a centre Add key. At 900px+ the tab bar becomes a sidebar and sheets slide in from the right. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE5; --line-soft:#E5E9EF;
  --fg:#0F1728; --muted:#586274; --faint:#8891A1;
  --accent-l:#2F47C9; --accent-d:#97A7FF; --accent:var(--accent-l); --on-accent:#FFFFFF;
  --ok:#1C7A45; --warn:#9A5800; --bad:#B8321F; --cold:#4D6A8C; --on-bad:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --ok-soft:color-mix(in srgb,var(--ok) 12%,var(--surface));
  --warn-soft:color-mix(in srgb,var(--warn) 12%,var(--surface));
  --bad-soft:color-mix(in srgb,var(--bad) 10%,var(--surface));
  --hover:color-mix(in srgb,var(--fg) 4%,transparent);
  --scrim:rgb(8 12 22 / .46);
  --shadow:0 1px 2px rgb(15 23 40 / .06),0 10px 30px rgb(15 23 40 / .10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F17; --surface:#131925; --surface-2:#1B2330; --line:#2A3342; --line-soft:#212938;
  --fg:#E7EBF2; --muted:#98A3B6; --faint:#6E7A8F;
  --accent:var(--accent-d); --on-accent:#0A0F1C;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --cold:#93B4DA; --on-bad:#1A0705;
  --hover:color-mix(in srgb,var(--fg) 6%,transparent); --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 34px rgb(0 0 0 / .45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F17; --surface:#131925; --surface-2:#1B2330; --line:#2A3342; --line-soft:#212938;
  --fg:#E7EBF2; --muted:#98A3B6; --faint:#6E7A8F;
  --accent:var(--accent-d); --on-accent:#0A0F1C;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --cold:#93B4DA; --on-bad:#1A0705;
  --hover:color-mix(in srgb,var(--fg) 6%,transparent); --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 34px rgb(0 0 0 / .45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Shell */
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line-soft)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 15px/1 var(--f-display);letter-spacing:.02em;flex:none}
.biz{min-width:0;flex:1}
.biz b{display:block;font:600 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz span{font-size:12px;color:var(--muted)}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.off i{background:var(--bad)}
main{padding-block:18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;width:100%;margin:0 auto;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--nav-h);max-width:560px;margin:0 auto;align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0;position:relative;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .add-key{width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-20px}
.nav .add-key svg{width:26px;height:26px}
.badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:var(--on-bad);font:600 10px/17px var(--f-body);text-align:center;padding:0 4px}
.side .badge{position:static;margin-left:auto}

@media (min-width:900px){
  .shell{grid-template-columns:252px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side-brand{display:flex;gap:12px;align-items:center;padding:4px 6px 18px}
  .side-nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
  .side-nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:500;text-align:left}
  .side-nav button:hover{background:var(--hover);color:var(--fg)}
  .side-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side-nav svg{width:20px;height:20px}
  .side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
  .top,.nav{display:none}
  main{padding-block:32px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* Type + sections */
.h1{font:700 30px/1.12 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font:600 18px/1.3 var(--f-display);margin:0;text-wrap:balance}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.two{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.two .sec{margin-top:0}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.stat:hover{border-color:var(--line)}
.stat b{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.strip{margin-top:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 16px}
.strip b{font-variant-numeric:tabular-nums}

/* Register rows */
.ledger{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line-soft);background:none;width:100%;text-align:left;color:var(--fg)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.sn{font:500 11px/1 var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.row-main{min-width:0}
.row-name{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.row-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.prio{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.prio.hot{background:var(--bad)} .prio.warm{background:var(--warn)} .prio.cold{background:var(--cold)}
[hidden]{display:none!important}
.pill{display:inline-block;height:22px;line-height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.pill.won{background:var(--ok-soft);color:var(--ok)} .pill.lost{background:var(--surface-2);color:var(--muted)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.due{font:500 12px/1 var(--f-mono);color:var(--muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.due svg{width:12px;height:12px}
.due.warn{color:var(--warn)} .due.bad{color:var(--bad)}
.val{font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.quick{display:flex;gap:6px}
.quick a,.quick button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line-soft);background:var(--surface);color:var(--fg);text-decoration:none}
.quick a.wa{color:var(--ok)}
.quick svg{width:17px;height:17px}

/* Buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--fg);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger.solid{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn.plain{border-color:transparent;background:transparent}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13.5px;font-weight:600}
.field>span em{font-style:normal;font-weight:400;color:var(--muted)}
.field small{color:var(--muted);font-size:12.5px}
.input{width:100%;height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
select.input{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px}
.note{font-size:12.5px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search .input{padding-left:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips.scroll{flex-wrap:wrap;margin-inline:0;padding-inline:0}}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--fg);cursor:pointer;flex:none}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip .ct{font:500 11px/1 var(--f-mono);opacity:.7}
.chip .x{margin-right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:0;background:none;color:inherit;opacity:.7;padding:0}
.chip .x svg{width:13px;height:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{height:40px;font-size:14px;border-radius:10px;width:auto}

/* Banners + empty */
.banner{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);font-size:13.5px;margin-bottom:16px}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner p{margin:0;flex:1 1 220px;min-width:0}
.empty{padding:32px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--fg);font:600 18px/1.3 var(--f-display)}
.empty p{margin:0;max-width:36ch}
.empty .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .ic svg{width:24px;height:24px}

/* Bars */
.bars{display:flex;flex-direction:column;gap:12px;padding:16px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:13.5px;align-items:baseline}
.bar-row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:2px}
.bar.won i{background:var(--ok)} .bar.lost i{background:var(--faint)}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-inline:-16px;padding-inline:16px;margin-top:18px;align-items:start}
@media (min-width:640px){.board{grid-auto-columns:300px}}
@media (min-width:900px){.board{margin-inline:0;padding-inline:0}}
.col{scroll-snap-align:start;background:var(--surface-2);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 4px 6px}
.col-h b{font:600 15px/1.2 var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h span{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.col-empty{font-size:13px;color:var(--faint);padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card-top{display:flex;gap:8px;align-items:center;min-width:0;background:none;border:0;padding:0;text-align:left;color:var(--fg);width:100%}
.card-top b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.card-meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card-move{display:flex;gap:6px}
.card-move button{width:30px;height:28px;border-radius:8px;border:1px solid var(--line-soft);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.card-move button:disabled{opacity:.35}
.card-move svg{width:15px;height:15px}

/* Sheet + dialog */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line);position:absolute;top:7px;left:50%;transform:translateX(-50%)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:18px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line-soft)}
.sheet-h h3{flex:1;margin:0;font:600 19px/1.25 var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));flex:1;min-height:0}

/* validate + migrate anything loaded or restored */
function sanitizeLead(l, stageIds, fallbackStage){
  if (!l || typeof l !== 'object') return null;
  const name = clampStr(l.name, MAX_NAME); if (!name) return null;
  const v = Number(l.value);
  return {
    id: typeof l.id === 'string' && l.id ? l.id.slice(0,64) : uid(),
    sn: Number.isInteger(l.sn) && l.sn > 0 ? l.sn : 0,
    name, phone: clampStr(l.phone, 24), email: clampStr(l.email, 160),
    source: clampStr(l.source, 60), interest: clampStr(l.interest, MAX_TEXT),
    value: isFinite(v) && v >= 0 && l.value !== '' && l.value !== null ? Math.round(v) : null,
    stage: stageIds.has(l.stage) ? l.stage : fallbackStage,
    prio: ['hot','warm','cold'].includes(l.prio) ? l.prio : 'warm',
    followUp: isDateStr(l.followUp) ? l.followUp : null,
    followTime: isTimeStr(l.followTime) ? l.followTime : null,
    sample: !!l.sample,
    closedAt: l.closedAt && !isNaN(new Date(l.closedAt)) ? new Date(l.closedAt).toISOString() : null,
    createdAt: isNaN(new Date(l.createdAt)) ? nowISO() : new Date(l.createdAt).toISOString(),
    updatedAt: isNaN(new Date(l.updatedAt)) ? nowISO() : new Date(l.updatedAt).toISOString(),
    activity: Array.isArray(l.activity) ? l.activity.filter(a => a && typeof a.text === 'string').slice(0, 500).map(a => ({
      id: typeof a.id === 'string' ? a.id.slice(0,64) : uid(),
      type: ['created','stage','note','log','followup','edit'].includes(a.type) ? a.type : 'note',
      text: a.text.slice(0, MAX_NOTE),
      at: isNaN(new Date(a.at)) ? nowISO() : new Date(a.at).toISOString(),
    })) : [],
  };
}
function migrate(d){
  if (!d || typeof d !== 'object' || !d.profile) return null;
  const out = blankState();
  const p = d.profile;
  out.profile = {
    name: clampStr(p.name, 80) || 'You', business: clampStr(p.business, 80) || 'My business',
    phone: clampStr(p.phone, 24), industry: INDUSTRIES[p.industry] ? p.industry : 'other',
    accent: ACCENTS.some(a => a.id === p.accent) ? p.accent : 'carbon',
    currency: CURRENCIES.some(c => c[0] === p.currency) ? p.currency : 'INR',
    countryCode: /^\+\d{1,4}$/.test(p.countryCode || '') ? p.countryCode : '+91',
    createdAt: p.createdAt || nowISO(),
  };
  const s = d.settings && typeof d.settings === 'object' ? d.settings : makeSettings(out.profile.industry);
  const base = makeSettings(out.profile.industry);
  let stages = Array.isArray(s.stages) ? s.stages.filter(x => x && clampStr(x.name, 40)).map(x => ({id: typeof x.id === 'string' && x.id ? x.id.slice(0,64) : uid(), name: clampStr(x.name, 40), kind: ['open','won','lost'].includes(x.kind) ? x.kind : 'open'})) : [];
  if (!stages.some(x => x.kind === 'open')) stages = base.stages;
  out.settings = {
    stages,
    sources: Array.isArray(s.sources) ? [...new Set(s.sources.map(x => clampStr(x, 40)).filter(Boolean))].slice(0, 40) : base.sources,
    waTemplate: typeof s.waTemplate === 'string' && s.waTemplate.trim() ? s.waTemplate.slice(0, 1000) : DEFAULT_WA,
    valueLabel: clampStr(s.valueLabel, 30) || base.valueLabel,
    interestHint: clampStr(s.interestHint, 120) || base.interestHint,
  };
  const ids = new Set(stages.map(x => x.id)), first = stages.find(x => x.kind === 'open').id;
  out.leads = (Array.isArray(d.leads) ? d.leads : []).map(l => sanitizeLead(l, ids, first)).filter(Boolean);
  let seq = Number.isInteger(d.seq) ? d.seq : 0;
  out.leads.forEach(l => { if (!l.sn) l.sn = ++seq; seq = Math.max(seq, l.sn); });
  out.seq = seq;
  out.lastBackup = d.lastBackup && !isNaN(new Date(d.lastBackup)) ? d.lastBackup : null;
  out.updatedAt = d.updatedAt || nowISO();
  return out;
}

function dueInfo(l){
  if (!l.followUp || !isOpenLead(l)) return null;
  const d = daysBetween(todayStr(), l.followUp);
  const t = l.followTime ? ' ' + fmtTime(l.followTime) : '';
  if (d < 0) return {cls:'bad', d, text: (-d === 1 ? 'Yesterday' : -d + 'd overdue')};
  if (d === 0) return {cls:'warn', d, text:'Today' + t};
  if (d === 1) return {cls:'', d, text:'Tomorrow' + t};
  if (d < 7) return {cls:'', d, text: parseDate(l.followUp).toLocaleDateString('en-IN',{weekday:'short'}) + t};
  return {cls:'', d, text: fmtDate(l.followUp)};
}
const dueLeads = () => state.leads.filter(l => { const i = dueInfo(l); return i && i.d <= 0; })
  .sort((a,b) => (a.followUp + (a.followTime||'')).localeCompare(b.followUp + (b.followTime||'')));

function addActivity(l, type, text){

function waText(l){

const telLink = l => { const c = cleanPhone(l.phone); return c ? 'tel:' + c : ''; };
function gcalLink(l){
  const date = l.followUp || addDays(1);
  const ymd = date.replace(/-/g, '');
  let dates;
  if (l.followTime){
    const [h, m] = l.followTime.split(':').map(Number);

    const e = new Date(s.getTime() + 30*60000);

    dates = f(s) + '/' + f(e);

function confirmBox({title, body='', ok='Confirm', cancel='Cancel', danger=false}){
  return new Promise(res => {
    const d = $('#dialog'), sc = $('#dscrim'), back = document.activeElement;
    d.innerHTML = `<h4 id="dlgTitle">${esc(title)}</h4>${body ? `<p>${body}</p>` : ''}<div class="acts-row"><button class="btn" type="button" data-r="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" type="button" data-r="1">${esc(ok)}</button></div>`;
    d.setAttribute('aria-labelledby','dlgTitle');
    d.hidden = false; sc.hidden = false; requestAnimationFrame(() => { d.classList.add('on'); sc.classList.add('on'); });
    const done = v => {
      d.classList.remove('on'); sc.classList.remove('on');
      setTimeout(() => { d.hidden = true; sc.hidden = true; }, 200);
      d.onclick = null; sc.onclick = null; document.removeEventListener('keydown', key, true);
      if (back && document.contains(back)) { try { back.focus({preventScroll:true}); } catch {} }
      res(v);
    };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(false); } };
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); };
    sc.onclick = () => done(false);
    document.addEventListener('keydown', key, true);
    d.querySelector('[data-r="1"]').focus();
  });
}

/* file saving: viewer capability when framed, normal download when self-hosted, copy sheet otherwise */
let dlPromise = null;
const framed = () => !!(window.claude && typeof window.claude.use === 'function');
function getDownloads(){
  if (!dlPromise) dlPromise = framed() ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
async function saveFile(filename, data, mime){
  if (framed()){
    const dl = await getDownloads();
    if (dl){
      try { await dl.save({filename, data}); return 'saved'; }
      catch (e) {
        const c = e && e.code;
        if (c === 'declined') return 'declined';
        if (c === 'rate_limited') { toast('A save is already waiting. Finish that one first.'); return 'declined'; }
      }
    }
    return 'fallback';
  }
  try {
    const url = URL.createObjectURL(new Blob([data], {type: mime}));
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'saved';
  } catch { return 'fallback'; }
}

function filteredLeads(){
  const q = ui.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let r = state.leads.filter(l => {
    if (ui.stage === 'due'){ const d = dueInfo(l); if (!d || d.d > 0) return false; }
    else if (ui.stage !== 'all' && l.stage !== ui.stage) return false;
    if (ui.prio !== 'all' && l.prio !== ui.prio) return false;
    if (ui.src !== 'all' && l.source !== ui.src) return false;
    if (!q) return true;
    if (qd.length >= 3 && phoneDigits(l.phone).includes(qd)) return true;
    return [l.name, l.email, l.interest, l.source].some(x => x && x.toLowerCase().includes(q));
  });
  const cmp = {
    recent: (a, b) => b.createdAt.localeCompare(a.createdAt),
    updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt),
    value: (a, b) => (b.value || 0) - (a.value || 0),
    name: (a, b) => a.name.localeCompare(b.name, 'en', {sensitivity:'base'}),
    follow: (a, b) => (a.followUp ? a.followUp + (a.followTime || '') : '9999').localeCompare(b.followUp ? b.followUp + (b.followTime || '') : '9999'),
  }[ui.sort] || ((a, b) => b.createdAt.localeCompare(a.createdAt));
  return r.sort(cmp);
}

  const box = $('#leadList'); if (!box) return;

/* ---------- choice dialog (3-way) ---------- */
function choiceBox({title, body='', options, cancel='Cancel'}){
  return new Promise(res => {
    const d = $('#dialog'), sc = $('#dscrim'), back = document.activeElement;
    d.innerHTML = `<h4 id="dlgTitle">${esc(title)}</h4>${body ? `<p>${body}</p>` : ''}<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${options.map(o => `<button class="btn ${o.kind || ''}" type="button" data-r="${esc(o.value)}">${esc(o.label)}</button>`).join('')}<button class="btn ghost" type="button" data-r="">${esc(cancel)}</button></div>`;
    d.setAttribute('aria-labelledby','dlgTitle');
    d.hidden = false; sc.hidden = false; requestAnimationFrame(() => { d.classList.add('on'); sc.classList.add('on'); });
    const done = v => {
      d.classList.remove('on'); sc.classList.remove('on'); setTimeout(() => { d.hidden = true; sc.hidden = true; }, 200);
      d.onclick = null; sc.onclick = null; document.removeEventListener('keydown', key, true);
      if (back && document.contains(back)) { try { back.focus({preventScroll:true}); } catch {} }
      res(v || null);
    };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(null); } };
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r); };
    sc.onclick = () => done(null);
    document.addEventListener('keydown', key, true);
    d.querySelector('[data-r]').focus();
  });
}

/* ---------- money input ---------- */
function parseMoney(s){
  s = String(s || '').trim().toLowerCase().replace(/[,₹$€£\s]/g, '').replace(/^(rs\.?|inr)/, '');
  if (!s) return {ok:true, v:null};
  const m = s.match(/^(\d+(?:\.\d+)?)(k|l|lac|lacs|lakh|lakhs|cr|crore|crores|m|mn)?$/);
  if (!m) return {ok:false};
  const mult = {k:1e3, l:1e5, lac:1e5, lacs:1e5, lakh:1e5, lakhs:1e5, cr:1e7, crore:1e7, crores:1e7, m:1e6, mn:1e6}[m[2]] || 1;
  const v = Math.round(parseFloat(m[1]) * mult);
  return v > 1e13 ? {ok:false} : {ok:true, v};
}

function stageOp(kind, id, extra){
  const S = state.settings.stages, i = S.findIndex(s => s.id === id); if (i < 0) return;
  if (kind === 'move'){ const j = i + extra; if (j < 0 || j >= S.length) return; [S[i], S[j]] = [S[j], S[i]]; commit(); return; }
  if (kind === 'rename'){ const n = clampStr(extra, 40); if (!n){ render(); return toast('A stage needs a name.', 'bad'); } if (n === S[i].name) return; S[i].name = n; commit({render:false}); renderChrome(); toast('Stage renamed'); return; }
  if (kind === 'kind'){
    const prev = S[i].kind; S[i].kind = extra;
    if (!S.some(s => s.kind === 'open')){ S[i].kind = prev; render(); return toast('Keep at least one open stage.', 'bad'); }
    state.leads.forEach(l => { if (l.stage === id) l.closedAt = extra === 'open' ? null : (l.closedAt || nowISO()); });
    commit(); return;
  }
}
async function deleteStage(id){
  const S = state.settings.stages, s = S.find(x => x.id === id); if (!s) return;
  if (S.length <= 2) return toast('Keep at least two stages.', 'bad');
  const rest = S.filter(x => x.id !== id);
  if (!rest.some(x => x.kind === 'open')) return toast('Keep at least one open stage.', 'bad');
  const n = state.leads.filter(l => l.stage === id).length;
  const target = rest.find(x => x.kind === s.kind) || rest.find(x => x.kind === 'open');
  const ok = await confirmBox({title:`Delete “${s.name}”?`, body: n ? `${plural(n, 'lead')} in this stage will move to ${esc(target.name)}.` : 'No leads are in this stage.', ok:'Delete stage', danger:true});
  if (!ok) return;
  state.leads.forEach(l => { if (l.stage === id){ l.stage = target.id; addActivity(l, 'stage', `Moved to ${target.name} because ${s.name} was deleted`); } });
  state.settings.stages = rest;
  if (ui.stage === id) ui.stage = 'all';
  commit(); toast('Stage deleted');
}

function csvCell(v){
  let s = String(v ?? '');
  if (/^[=@\t\r]/.test(s) || /^[+\-][^\d\s]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
async function exportCSV(){
  if (!state.leads.length) return toast('Add a lead first. There is nothing to export yet.');
  const head = ['No.','Name','Phone','Email','Source','Looking for',state.settings.valueLabel + ' (' + state.profile.currency + ')','Stage','Status','Priority','Next follow-up','Follow-up time','Added on','Last updated','Latest note'];
  const rows = state.leads.slice().sort((a, b) => a.sn - b.sn).map(l => {
    const note = l.activity.find(a => a.type === 'note' || a.type === 'log');
    return [sn(l), l.name, fmtPhone(l.phone), l.email, l.source, l.interest, l.value ?? '', stageById(l.stage).name, kindOf(l), prioName(l.prio), l.followUp || '', l.followTime || '', l.createdAt.slice(0, 10), l.updatedAt.slice(0, 10), note ? note.text : ''].map(csvCell).join(',');
  });
  const csv = '﻿' + [head.map(csvCell).join(','), ...rows].join('\r\n');
  const r = await saveFile(`leadbook-${slug(state.profile.business)}-${todayStr()}.csv`, csv, 'text/csv;charset=utf-8');
  if (r === 'saved') toast('Excel file saved'); else if (r === 'declined') toast('Export not saved');
  else openSheet({title:'Export for Excel', ctx:{type:'csv'}, body:`<div class="form"><p class="muted" style="margin:0">Downloads are not available here. Copy this text, paste it into a new Google Sheet or Excel sheet, and use Split text to columns.</p><textarea class="input backup-text" id="bkText" readonly rows="8">${esc(csv.slice(1))}</textarea></div>`, foot:`<button class="btn" type="button" data-act="close-sheet">Close</button><button class="btn primary" type="button" data-act="copy-csv">${ic('copy')} Copy</button>`});
}

  openSheet({title:'Restore a backup', ctx:{type:'restore'},
    body:`<div class="form"><p class="muted" style="margin:0">Choose a Leadbook backup file (.json) saved from this or another device.</p>
      <button class="btn primary" type="button" data-act="pick-file">${ic('ul')} Choose backup file</button>
      <label class="field"><span>Or paste backup text</span><textarea class="input backup-text" id="pasteIn" rows="6" placeholder='{"app":"leadbook",…}'></textarea></label>
      <span class="err" id="eRestore" hidden></span>
      <button class="btn" type="button" data-act="restore-text" style="align-self:flex-start">Restore from text</button></div>`});
}
function parseBackup(text){
  let j; try { j = JSON.parse(String(text).replace(/^﻿/, '')); } catch { return {err:'This is not a Leadbook backup. The file could not be read.'}; }
  const data = j && j.app === 'leadbook' && j.data ? j.data : j;
  const m = migrate(data);
  return m ? {data: m} : {err:'This file has no Leadbook profile in it. Pick the .json file you saved from Backup.'};
}
function mergeInto(incoming){
  const byId = new Map(state.leads.map(l => [l.id, l]));
  const usedSn = new Set(state.leads.map(l => l.sn));
  const mapStage = st => {
    const s = incoming.settings.stages.find(x => x.id === st);
    const mine = state.settings.stages;
    return (s && (mine.find(x => x.id === s.id) || mine.find(x => x.name.toLowerCase() === s.name.toLowerCase()) || mine.find(x => x.kind === s.kind)) || mine.find(x => x.kind === 'open')).id;
  };
  let added = 0, updated = 0;
  incoming.leads.forEach(src => {
    const l = Object.assign({}, src, {stage: mapStage(src.stage)});
    const have = byId.get(l.id);
    if (have){ if (l.updatedAt > have.updatedAt){ l.sn = have.sn; Object.assign(have, l); updated++; } return; }
    if (usedSn.has(l.sn)) l.sn = ++state.seq;
    usedSn.add(l.sn); state.seq = Math.max(state.seq, l.sn);
    state.leads.push(l); added++;
  });
  incoming.settings.sources.forEach(s => { if (!state.settings.sources.some(x => x.toLowerCase() === s.toLowerCase())) state.settings.sources.push(s); });
  return {added, updated};
}
async function applyRestore(text){
  const r = parseBackup(text);
  if (r.err){ const e = $('#eRestore'); if (e){ e.hidden = false; e.textContent = r.err; } else toast(r.err, 'bad'); return; }
  const inc = r.data;
  if (!state.profile){
    state = inc; state.lastBackup = nowISO(); closeSheet(); requestPersist(); commit();
    return toast(`Restored ${plural(inc.leads.length, 'lead')} for ${inc.profile.business}`);
  }
  const choice = await choiceBox({title:'Restore this backup?', body:`The backup has ${plural(inc.leads.length, 'lead')} from ${esc(inc.profile.business)}. You have ${plural(state.leads.length, 'lead')} on this device now.`,
    options:[{value:'merge', label:'Add to my current leads', kind:'primary'},{value:'replace', label:'Replace everything on this device', kind:'danger'}]});
  if (!choice) return;
  if (choice === 'replace'){ state = inc; closeSheet(); commit(); return toast(`Restored ${plural(inc.leads.length, 'lead')}`); }
  const res = mergeInto(inc); closeSheet(); commit();
  toast(`Added ${plural(res.added, 'lead')}${res.updated ? `, updated ${res.updated}` : ''}`);
}

/* ---------- samples ---------- */
const SAMPLE_VALUE = {real_estate:8500000, interior:1200000, architecture:650000, fashion:85000, jewellery:240000, cafe:24000, services:90000, ecommerce:45000, other:50000};
function addSamples(){
  const open = stages().filter(s => s.kind === 'open'), src = state.settings.sources, base = SAMPLE_VALUE[state.profile.industry] || 50000;
  const mk = (name, i, extra) => {
    const l = Object.assign({id: uid(), sn: ++state.seq, name, phone:'', email:'', source: src[i % src.length] || '', interest:'', value:null, stage:(open[i] || open[0]).id, prio:'warm', followUp:null, followTime:null, sample:true, closedAt:null, createdAt: new Date(Date.now() - (i + 1) * 864e5).toISOString(), updatedAt: nowISO(), activity: []}, extra);
    addActivity(l, 'created', 'Sample lead added'); return l;
  };
  state.leads.push(
    mk('Aarav Mehta', 0, {interest: state.settings.interestHint, value: base, prio:'hot', followUp: todayStr(), followTime:'11:30'}),
    mk('Neha Kapoor', 1, {interest:'Wants a call back after 6 pm', value: Math.round(base * 0.6), followUp: addDays(2)}),
    mk('Rohan Gupta', 2, {interest:'Comparing two quotes', value: Math.round(base * 1.4), prio:'cold', followUp: addDays(-1)}),
  );
  commit(); toast('Added 3 sample leads');
}
async function clearSamples(){
  const n = state.leads.filter(l => l.sample).length; if (!n) return;
  if (!await confirmBox({title:'Remove sample leads?', body:`${plural(n, 'sample lead')} will be removed. Your own leads stay.`, ok:'Remove samples'})) return;
  state.leads = state.leads.filter(l => !l.sample);
  if (!state.leads.length) state.seq = 0;
  commit(); toast('Samples removed');
}

/* ---------- persistence ---------- */
async function requestPersist(){ try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch {} }
async function checkPersist(){ try { if (navigator.storage && navigator.storage.persisted){ persisted = await navigator.storage.persisted(); if (ui.view === 'settings' && state.profile) render(); } } catch {} }

/* ---------- events ---------- */
async function handleAct(act, el){
  const id = el.dataset.id;
  switch (act){
    case 'close-sheet': return closeSheet();
    case 'new-lead': return openLeadForm(null);
    case 'edit-lead': return openLeadForm(id);
    case 'back-detail': return id ? openDetail(id) : closeSheet();
    case 'go-search': ui.view = 'leads'; render(); setTimeout(() => $('#q') && $('#q').focus(), 30); return;
    case 'filter-due': ui.stage = 'due'; ui.q = ''; ui.view = 'leads'; render(); window.scrollTo(0, 0); return;
    case 'filter-recent': ui.stage = 'all'; ui.q = ''; ui.sort = 'recent'; ui.view = 'leads'; render(); window.scrollTo(0, 0); return;
    case 'clear-filters': ui.q = ''; ui.stage = 'all'; ui.prio = 'all'; ui.src = 'all'; render(); return;
    case 'add-samples': return addSamples();
    case 'clear-samples': return clearSamples();
    case 'copy-phone': { const l = getLead(id); if (l && l.phone) copyText(fmtPhone(l.phone), 'Number copied'); return; }
    case 'add-note': {
      const l = detailLead(), inp = $('#noteIn'); if (!l || !inp) return;
      const t = clampStr(inp.value, MAX_NOTE); if (!t){ inp.focus(); return toast('Write a note first.'); }
      inp.value = ''; addActivity(l, 'note', t); commit(); toast('Note added'); return;
    }
    case 'delete-lead': {
      const l = getLead(id); if (!l) return;
      if (!await confirmBox({title:`Delete ${l.name}?`, body:'This lead and its history will be removed from this device.', ok:'Delete lead', danger:true})) return;
      state.leads = state.leads.filter(x => x.id !== id); closeSheet(); commit(); toast('Lead deleted'); return;
    }
    case 'backup': return doBackup();
    case 'backup-text': return showBackupText();
    case 'copy-backup': if (await copyText($('#bkText').value, 'Backup copied')){ state.lastBackup = nowISO(); commit({render:false}); } return;
    case 'copy-csv': return copyText($('#bkText').value, 'Copied. Paste it into a sheet.');
    case 'export-csv': return exportCSV();
    case 'restore': return openRestore();
    case 'pick-file': { const f = $('#fileIn'); f.value = ''; f.click(); return; }
    case 'restore-text': { const t = $('#pasteIn').value.trim(); if (!t){ const e = $('#eRestore'); e.hidden = false; e.textContent = 'Paste the backup text first.'; return; } return applyRestore(t); }
    case 'save-wa': { const v = $('#waT').value.trim(); state.settings.waTemplate = v ? v.slice(0, 1000) : DEFAULT_WA; commit({render:false}); toast('Message saved'); return; }
    case 'reset-wa': state.settings.waTemplate = DEFAULT_WA; commit(); toast('Default message restored'); return;
    case 'erase': {
      if (!await confirmBox({title:'Erase everything?', body:`Your profile and ${plural(state.leads.length, 'lead')} will be deleted from this device. This cannot be undone.`, ok:'Erase everything', danger:true})) return;
      try { localStorage.removeItem(KEY); localStorage.removeItem(UI_KEY); } catch {}
      state = blankState(); store.mem = null; Object.assign(ob, {step:1, name:'', business:'', phone:'', industry:'', accent:'carbon', err:{}});
      ui.view = 'home'; ui.stage = 'all'; ui.q = ''; closeSheet(); render(); toast('Lead book erased'); return;
    }
  }
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('a[href]')) return; /* calls, WhatsApp, calendar: let the link work */
  const ac = t.closest('[data-act]'); if (ac){ if (ac.getAttribute('aria-disabled') === 'true') return; e.preventDefault(); return handleAct(ac.dataset.act, ac); }
  const nav = t.closest('[data-nav]'); if (nav){ e.preventDefault(); if (sheetOpen()) closeSheet(); return go(nav.dataset.nav); }
  const op = t.closest('[data-open]'); if (op){ e.preventDefault(); return openDetail(op.dataset.open); }
  const obb = t.closest('[data-ob]'); if (obb) return obStep(obb.dataset.ob);
  const chip = t.closest('[data-stage]'); if (chip){ ui.stage = chip.dataset.stage; $$('[data-stage]').forEach(c => c.setAttribute('aria-pressed', c === chip)); return renderLeadList(); }
  const so = t.closest('[data-stage-open]'); if (so){ ui.stage = so.dataset.stageOpen; ui.view = 'leads'; return render(); }
  const mv = t.closest('[data-move]'); if (mv){
    const l = getLead(mv.dataset.move); if (!l) return;
    const S = stages(), i = S.findIndex(s => s.id === l.stage), j = i + Number(mv.dataset.dir);
    if (j < 0 || j >= S.length) return;
    setStage(l, S[j].id); commit(); toast(`${l.name} moved to ${S[j].name}`); return;
  }
  const ss = t.closest('[data-setstage]'); if (ss){ const l = detailLead(); if (l && setStage(l, ss.dataset.setstage)){ commit(); toast(`Moved to ${stageById(l.stage).name}`); } return; }
  const sf = t.closest('[data-setfu]'); if (sf){
    const l = detailLead(); if (!l) return;
    const v = sf.dataset.setfu;
    if (v === 'clear'){ l.followUp = null; l.followTime = null; } else { l.followUp = addDays(Number(v)); }
    addActivity(l, 'followup', fuText(l)); commit(); toast(fuText(l)); return;
  }
  const ff = t.closest('[data-formfu]'); if (ff){ const v = ff.dataset.formfu, d = $('#fDate'); if (v === 'clear'){ d.value = ''; $('#fTime').value = ''; } else d.value = addDays(Number(v)); return; }
  const lg = t.closest('[data-log]'); if (lg){ const l = detailLead(); if (!l) return; const note = $('#noteIn') ? clampStr($('#noteIn').value, MAX_NOTE) : ''; addActivity(l, 'log', lg.dataset.log + (note ? ': ' + note : '')); if (note) $('#noteIn').value = ''; commit(); toast(`Logged: ${lg.dataset.log}`); return; }
  const da = t.closest('[data-delact]'); if (da){ const l = detailLead(); if (!l) return; if (!await confirmBox({title:'Remove this entry?', ok:'Remove', danger:true})) return; l.activity = l.activity.filter(a => a.id !== da.dataset.delact); l.updatedAt = nowISO(); commit(); return; }
  const sm = t.closest('[data-stmove]'); if (sm) return stageOp('move', sm.dataset.stmove, Number(sm.dataset.dir));
  const sd = t.closest('[data-stdel]'); if (sd) return deleteStage(sd.dataset.stdel);
  const ds = t.closest('[data-delsrc]'); if (ds){ state.settings.sources = state.settings.sources.filter(s => s !== ds.dataset.delsrc); if (ui.src === ds.dataset.delsrc) ui.src = 'all'; commit(); return; }
  if (t.id === 'scrim') closeSheet();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen() && $('#dialog').hidden){ e.preventDefault(); return closeSheet(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.row[data-open]')){ e.preventDefault(); openDetail(e.target.dataset.open); }
});

let qT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ clearTimeout(qT); qT = setTimeout(() => { ui.q = t.value; renderLeadList(); }, 90); return; }
  if (t.id === 'fPhone') return checkDup();
  if (t.id === 'fValue'){ const m = parseMoney(t.value), h = $('#valHint'); if (h) h.textContent = m.ok && m.v != null ? fmtMoney(m.v) + (state.profile.currency === 'INR' && m.v >= 1e5 ? ' (' + fmtMoney(m.v, true) + ')' : '') : ''; return; }
  if (t.id === 'waT'){ const keep = state.settings.waTemplate; state.settings.waTemplate = t.value || DEFAULT_WA; $('#waPrev').textContent = waText({name:'Aarav Mehta', interest: state.settings.interestHint}); state.settings.waTemplate = keep; return; }
  if (t.id === 'fDate'){ const tm = $('#fTime'); if (tm) tm.disabled = false; }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fPrio'){ ui.prio = t.value; return renderLeadList(); }
  if (t.id === 'fSrc'){ ui.src = t.value; return renderLeadList(); }
  if (t.id === 'fSort'){ ui.sort = t.value; uiPrefs.save({view: ui.view, sort: ui.sort, prio: ui.prio, src: ui.src}); return renderLeadList(); }
  if (t.name === 'acc'){ obCapture(); return renderOnboarding(); }
  if (t.name === 'setAcc'){ state.profile.accent = t.value; commit(); return; }
  if (t.dataset.stname){ return stageOp('rename', t.dataset.stname, t.value); }
  if (t.dataset.stkind){ return stageOp('kind', t.dataset.stkind, t.value); }
  if (t.id === 'dDate' || t.id === 'dTime'){
    const l = detailLead(); if (!l) return;
    const d = $('#dDate').value, tm = $('#dTime').value;
    l.followUp = isDateStr(d) ? d : null; l.followTime = l.followUp && isTimeStr(tm) ? tm : null;
    addActivity(l, 'followup', fuText(l)); commit(); return;
  }
  if (t.id === 'fileIn'){
    const f = t.files && t.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast('That file is too large to be a Leadbook backup.', 'bad');
    const r = new FileReader();
    r.onload = () => applyRestore(r.result);
    r.onerror = () => toast('The file could not be opened. Try again.', 'bad');
    r.readAsText(f);
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'obForm') return obStep('next');
  if (id === 'leadForm') return saveLeadForm();
  if (id === 'profForm') return saveProfile();
  if (id === 'addStage'){
    const n = clampStr($('#newStage').value, 40); if (!n) return;
    const S = state.settings.stages;
    if (S.some(s => s.name.toLowerCase() === n.toLowerCase())) return toast('That stage already exists.', 'bad');
    if (S.length >= 12) return toast('You can have up to 12 stages.', 'bad');
    let at = S.findIndex(s => s.kind !== 'open'); if (at < 0) at = S.length;
    S.splice(at, 0, {id: uid(), name: n, kind:'open'}); commit(); toast('Stage added'); setTimeout(() => $('#newStage') && $('#newStage').focus(), 20); return;
  }
  if (id === 'addSrc'){
    const n = clampStr($('#newSrc').value, 40); if (!n) return;
    const L = state.settings.sources;
    if (L.some(s => s.toLowerCase() === n.toLowerCase())) return toast('That source is already in the list.');
    if (L.length >= 40) return toast('You can have up to 40 sources.', 'bad');
    L.push(n); commit(); setTimeout(() => $('#newSrc') && $('#newSrc').focus(), 20); return;
  }
});

/* ---------- boot ---------- */
function boot(){
  if (!store.probe()) store.ok = false;
  const d = store.load();
  if (d){ const m = migrate(d); if (m) state = m; }
  render();
  getDownloads();
  checkPersist();
  window.addEventListener('storage', e => {
    if (e.key !== KEY) return;
    try { const m = e.newValue ? migrate(JSON.parse(e.newValue)) : null; state = m || blankState(); if (!state.profile) closeSheet(); render(); } catch {}
  });
  let day = todayStr();
  const tick = () => { if (todayStr() !== day){ day = todayStr(); render(); } };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 60000);
}
boot();
})();
</script>
